services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agroloop
      POSTGRES_USER: agroloop
      POSTGRES_PASSWORD: agroloop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroloop -d agroloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://agroloop:agroloop@postgres:5432/agroloop?schema=public
      JWT_ACCESS_SECRET: local-development-access-secret-change-me
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-me
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:6999
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      VITE_API_URL: ""
    ports:
      - "6999:6999"
    depends_on:
      - api

volumes:
  postgres-data:
